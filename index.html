<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Flip</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold-light: #F5C842;
      --gold-mid: #D4A017;
      --gold-dark: #8B6914;
      --silver-light: #E8E8E8;
      --silver-mid: #B0B0B0;
      --silver-dark: #5C5C5C;
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --text: #F0EDE6;
      --text-muted: #888;
      --heads: #F5C842;
      --tails: #B0B0B0;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 3rem;
      font-family: 'Arial', sans-serif;
    }

    .coin-wrap {
      perspective: 600px;
      width: 160px;
      height: 160px;
      margin: 0 auto 3rem;
      cursor: pointer;
    }

    .coin {
      width: 160px;
      height: 160px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0s;
      border-radius: 50%;
    }

    .coin.flipping {
      animation: flip 1.2s cubic-bezier(.36,.07,.19,.97) forwards;
    }

    @keyframes flip {
      0%   { transform: rotateY(0deg) rotateX(10deg); }
      20%  { transform: rotateY(360deg) rotateX(25deg) translateY(-30px); }
      50%  { transform: rotateY(720deg) rotateX(20deg) translateY(-60px); }
      80%  { transform: rotateY(1080deg) rotateX(15deg) translateY(-20px); }
      100% { transform: rotateY(1440deg) rotateX(0deg) translateY(0px); }
    }

    .face {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Arial', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      user-select: none;
    }

    .face.heads {
      background: radial-gradient(circle at 38% 35%, #FFE57A, #D4A017 55%, #8B6914);
      color: #3a2800;
      box-shadow: inset 0 0 0 6px rgba(255,220,80,0.4), inset 0 0 0 8px rgba(180,130,0,0.3);
    }

    .face.tails {
      background: radial-gradient(circle at 38% 35%, #F0F0F0, #B0B0B0 55%, #5C5C5C);
      color: #333;
      box-shadow: inset 0 0 0 6px rgba(220,220,220,0.4), inset 0 0 0 8px rgba(140,140,140,0.3);
      transform: rotateY(180deg);
    }

    .face-symbol {
      font-size: 2.8rem;
      line-height: 1;
      margin-bottom: 6px;
    }

    .face-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      opacity: 0.7;
    }

    .flip-btn {
      background: transparent;
      border: 1.5px solid var(--gold-mid);
      color: var(--gold-light);
      font-family: 'Arial', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.75rem 2.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.1s;
      margin-bottom: 2.5rem;
    }

    .flip-btn:hover { background: rgba(213,160,23,0.12); }
    .flip-btn:active { transform: scale(0.97); }
    .flip-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .result {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      min-height: 2.2rem;
      transition: opacity 0.3s;
      text-align: center;
    }

    .result.heads { color: var(--gold-light); }
    .result.tails { color: var(--silver-light); }
    .result.hidden { opacity: 0; }

    .stats {
      display: flex;
      gap: 2rem;
      margin-top: 2.5rem;
      background: var(--surface);
      border: 0.5px solid #333;
      border-radius: var(--radius);
      padding: 1rem 2rem;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 400;
    }

    .stat-value.heads { color: var(--gold-light); }
    .stat-value.tails { color: var(--silver-light); }
    .stat-value.total { color: var(--text-muted); }

    .stat-label {
      font-family: 'Arial', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .divider {
      width: 0.5px;
      background: #333;
    }

    .history {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      max-width: 360px;
    }

    .hist-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .hist-dot.heads { background: var(--gold-mid); }
    .hist-dot.tails { background: var(--silver-mid); }

    .reset-btn {
      margin-top: 1.5rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Arial', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      transition: color 0.2s;
    }

    .reset-btn:hover { color: var(--text); }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .streak-badge {
      font-family: 'Arial', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 1rem;
      min-height: 1.2rem;
      text-align: center;
      transition: color 0.3s;
    }

    .streak-badge.hot {
      color: #ff9f43;
      text-shadow: 0 0 8px rgba(255,159,67,0.5);
    }

    .controls-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .ctrl-btn {
      background: transparent;
      border: 1px solid #444;
      color: var(--text-muted);
      font-family: 'Arial', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.45rem 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .ctrl-btn:hover { border-color: var(--gold-mid); color: var(--gold-light); }
    .ctrl-btn.active { border-color: #ff9f43; color: #ff9f43; background: rgba(255,159,67,0.08); }

    .speed-row {
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
      display: none;
    }
    .speed-label, .speed-val {
      font-family: 'Arial', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .speed-val { min-width: 2rem; }
    .speed-slider {
      -webkit-appearance: none;
      width: 90px; height: 3px;
      background: #444; border-radius: 2px; outline: none;
    }
    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%; background: var(--gold-mid); cursor: pointer;
    }

    .bo3-panel {
      margin-top: 1rem;
      background: var(--surface);
      border: 0.5px solid #333;
      border-radius: var(--radius);
      padding: 1.2rem 1.8rem;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      min-width: 230px;
      display: none;
    }
    .bo3-title {
      font-family: 'Arial', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .bo3-pick { display: flex; gap: 0.5rem; align-items: center; }
    .bo3-pick > span {
      font-family: 'Arial', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .bo3-pick-btn {
      background: transparent;
      font-family: 'Arial', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 50px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .bo3-pick-btn.heads { border: 1px solid #555; color: var(--gold-light); }
    .bo3-pick-btn.heads:hover { border-color: var(--gold-mid); }
    .bo3-pick-btn.tails { border: 1px solid #555; color: var(--silver-light); }
    .bo3-pick-btn.tails:hover { border-color: var(--silver-mid); }
    .bo3-score {
      display: flex; gap: 1rem; align-items: center;
      font-family: 'Arial', sans-serif; font-size: 0.85rem; letter-spacing: 0.08em;
    }
    .bo3-score .vs { color: var(--text-muted); font-size: 0.6rem; }
    .bo3-status {
      font-family: 'Arial', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-light);
      min-height: 1rem;
      text-align: center;
    }
    .bo3-cancel {
      background: transparent; border: none;
      color: var(--text-muted);
      font-family: 'Arial', sans-serif;
      font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; padding: 0.2rem; transition: color 0.2s;
    }
    .bo3-cancel:hover { color: #ff6b6b; }

    /* Login */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 2rem 1rem;
    }

    #coin-app { display: none; }

    .login-card {
      background: var(--surface);
      border: 0.5px solid #333;
      border-radius: var(--radius);
      padding: 2.5rem 2.5rem 2rem;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .login-coin-icon {
      font-size: 2.4rem;
      margin-bottom: 0.6rem;
      line-height: 1;
    }

    .login-title {
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 0.2rem;
    }

    .login-subtitle {
      font-family: 'Arial', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.8rem;
    }

    .login-field {
      width: 100%;
      margin-bottom: 1rem;
    }

    .login-field label {
      display: block;
      font-family: 'Arial', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .login-field input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid #333;
      border-radius: 8px;
      color: var(--text);
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      padding: 0.6rem 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-field input:focus {
      border-color: var(--gold-mid);
    }

    .login-error {
      font-family: 'Arial', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: #ff6b6b;
      min-height: 1.1rem;
      margin-bottom: 0.8rem;
      text-align: center;
    }

    .login-btn {
      width: 100%;
      background: transparent;
      border: 1.5px solid var(--gold-mid);
      color: var(--gold-light);
      font-family: 'Arial', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.75rem;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.1s;
      margin-top: 0.2rem;
    }

    .login-btn:hover { background: rgba(213,160,23,0.12); }
    .login-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <div class="login-coin-icon">☀</div>
      <div class="login-title">Coin Flip</div>
      <div class="login-subtitle">Members only</div>
      <div class="login-field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" spellcheck="false" />
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" />
      </div>
      <div class="login-error" id="login-error"></div>
      <button class="login-btn" onclick="attemptLogin()">Enter</button>
    </div>
  </div>

  <div id="coin-app">
  <h1>Coin Flip</h1>
  <p class="subtitle">Chance in motion</p>

  <div class="coin-wrap" id="coinWrap" onclick="flipCoin()" title="Click to flip">
    <div class="coin" id="coin">
      <div class="face heads">
        <div class="face-symbol">☀</div>
        <div class="face-label">Heads</div>
      </div>
      <div class="face tails">
        <div class="face-symbol">✦</div>
        <div class="face-label">Tails</div>
      </div>
    </div>
  </div>

  <button class="flip-btn" id="flipBtn" onclick="flipCoin()">Flip the coin</button>

  <div class="controls-row">
    <button class="ctrl-btn" id="autoBtn" onclick="toggleAutoFlip()">Auto Flip</button>
    <button class="ctrl-btn" id="bo3Btn" onclick="startBo3()">Best of 3</button>
  </div>
  <div class="speed-row" id="speedRow">
    <span class="speed-label">Interval</span>
    <input type="range" class="speed-slider" id="speedSlider" min="1.5" max="6" step="0.5" value="2" oninput="updateAutoSpeed(this.value)">
    <span class="speed-val" id="speedVal">2s</span>
  </div>
  <div class="bo3-panel" id="bo3Panel">
    <div class="bo3-title">Best of 3</div>
    <div class="bo3-pick" id="bo3Pick">
      <span>Pick:</span>
      <button class="bo3-pick-btn heads" onclick="pickBo3Side('heads')">Heads</button>
      <button class="bo3-pick-btn tails" onclick="pickBo3Side('tails')">Tails</button>
    </div>
    <div class="bo3-score" id="bo3Score" style="display:none">
      <span id="bo3YouScore">You 0</span>
      <span class="vs">vs</span>
      <span id="bo3HouseScore">House 0</span>
    </div>
    <div class="bo3-status" id="bo3Status"></div>
    <button class="bo3-cancel" onclick="cancelBo3()">✕ cancel</button>
  </div>

  <div class="result hidden" id="result">—</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value heads" id="headsCount">0</div>
      <div class="stat-label">Heads</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-value total" id="totalCount">0</div>
      <div class="stat-label">Flips</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-value tails" id="tailsCount">0</div>
      <div class="stat-label">Tails</div>
    </div>
  </div>

  <div class="history" id="history"></div>

  <div class="streak-badge" id="streakBadge"></div>
  <button class="reset-btn" onclick="resetStats()">↺ Reset stats</button>
  <canvas id="confetti-canvas"></canvas>
  </div><!-- end #coin-app -->

  <script>
    function attemptLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      if (user === 'penny' && pass === 'nickel') {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('coin-app').style.display = 'flex';
        document.getElementById('coin-app').style.flexDirection = 'column';
        document.getElementById('coin-app').style.alignItems = 'center';
        document.getElementById('coin-app').style.justifyContent = 'center';
        document.getElementById('coin-app').style.minHeight = '100vh';
        document.getElementById('coin-app').style.padding = '2rem 1rem';
      } else {
        const err = document.getElementById('login-error');
        err.textContent = 'Invalid username or password.';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'Enter' && document.getElementById('login-screen').offsetParent !== null) {
        attemptLogin();
      }
    });
  </script>

  <script>
    let heads = 0, tails = 0, streak = 0, lastResult = null;
    const coin = document.getElementById('coin');
    const btn = document.getElementById('flipBtn');
    const resultEl = document.getElementById('result');
    const histEl = document.getElementById('history');
    const streakBadge = document.getElementById('streakBadge');

    // Spacebar shortcut (only when coin app is visible)
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !btn.disabled
          && document.getElementById('coin-app').offsetParent !== null) {
        e.preventDefault();
        flipCoin();
      }
    });

    // ── Auto Flip ──────────────────────────────────────────────────
    let autoInterval = null;
    let autoDelay = 2000;

    function toggleAutoFlip() {
      if (bo3Active) return;
      const autoBtn = document.getElementById('autoBtn');
      const speedRow = document.getElementById('speedRow');
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        autoBtn.classList.remove('active');
        autoBtn.textContent = 'Auto Flip';
        speedRow.style.display = 'none';
        btn.style.display = '';
      } else {
        autoBtn.classList.add('active');
        autoBtn.textContent = 'Stop Auto';
        speedRow.style.display = 'flex';
        btn.style.display = 'none';
        autoInterval = setInterval(() => { if (!btn.disabled) flipCoin(); }, autoDelay);
      }
    }

    function updateAutoSpeed(val) {
      autoDelay = parseFloat(val) * 1000;
      document.getElementById('speedVal').textContent = val + 's';
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = setInterval(() => { if (!btn.disabled) flipCoin(); }, autoDelay);
      }
    }

    // ── Best of 3 ──────────────────────────────────────────────────
    let bo3Active = false, bo3Choice = null, bo3Done = 0, bo3You = 0, bo3House = 0;

    function startBo3() {
      if (autoInterval) return;
      bo3Active = true; bo3Choice = null; bo3Done = 0; bo3You = 0; bo3House = 0;
      const panel = document.getElementById('bo3Panel');
      panel.style.display = 'flex';
      document.getElementById('bo3Pick').style.display = 'flex';
      document.getElementById('bo3Score').style.display = 'none';
      document.getElementById('bo3Status').textContent = '';
      document.getElementById('bo3YouScore').textContent = 'You 0';
      document.getElementById('bo3HouseScore').textContent = 'House 0';
      btn.style.display = 'none';
      document.getElementById('autoBtn').style.display = 'none';
      document.getElementById('bo3Btn').style.display = 'none';
    }

    function pickBo3Side(side) {
      bo3Choice = side;
      document.getElementById('bo3Pick').style.display = 'none';
      document.getElementById('bo3Score').style.display = 'flex';
      document.getElementById('bo3Status').textContent = 'Flip 1 of 3…';
      setTimeout(flipCoin, 400);
    }

    function handleBo3Result(isHeads) {
      const side = isHeads ? 'heads' : 'tails';
      bo3Done++;
      if (side === bo3Choice) bo3You++; else bo3House++;
      document.getElementById('bo3YouScore').textContent = `You ${bo3You}`;
      document.getElementById('bo3HouseScore').textContent = `House ${bo3House}`;

      if (bo3You >= 2 || bo3House >= 2 || bo3Done >= 3) {
        const msg = bo3You > bo3House ? 'You win! 🎉' : bo3You < bo3House ? 'House wins.' : 'Draw!';
        document.getElementById('bo3Status').textContent = msg;
        if (bo3You > bo3House) launchConfetti();
        setTimeout(cancelBo3, 2600);
      } else {
        document.getElementById('bo3Status').textContent = `Flip ${bo3Done + 1} of 3…`;
        setTimeout(flipCoin, 700);
      }
    }

    function cancelBo3() {
      bo3Active = false;
      document.getElementById('bo3Panel').style.display = 'none';
      btn.style.display = '';
      document.getElementById('autoBtn').style.display = '';
      document.getElementById('bo3Btn').style.display = '';
    }

    // ── Core flip ──────────────────────────────────────────────────
    function flipCoin() {
      if (btn.disabled) return;
      btn.disabled = true;
      resultEl.classList.add('hidden');

      coin.classList.remove('flipping');
      void coin.offsetWidth;
      coin.classList.add('flipping');

      const isHeads = Math.random() < 0.5;

      setTimeout(() => {
        if (isHeads) {
          heads++;
          coin.style.transform = 'rotateY(0deg)';
          resultEl.textContent = 'Heads';
          resultEl.className = 'result heads';
        } else {
          tails++;
          coin.style.transform = 'rotateY(180deg)';
          resultEl.textContent = 'Tails';
          resultEl.className = 'result tails';
        }
        resultEl.classList.remove('hidden');

        document.getElementById('headsCount').textContent = heads;
        document.getElementById('tailsCount').textContent = tails;
        document.getElementById('totalCount').textContent = heads + tails;

        const dot = document.createElement('div');
        dot.className = 'hist-dot ' + (isHeads ? 'heads' : 'tails');
        histEl.appendChild(dot);
        if (histEl.children.length > 60) histEl.removeChild(histEl.firstChild);

        const side = isHeads ? 'heads' : 'tails';
        if (side === lastResult) { streak++; } else { streak = 1; lastResult = side; }
        updateStreakBadge(streak, side);
        if (streak >= 5) launchConfetti();

        coin.classList.remove('flipping');
        btn.disabled = false;

        if (bo3Active && bo3Choice) handleBo3Result(isHeads);
      }, 1200);
    }

    function updateStreakBadge(n, side) {
      if (n < 2) { streakBadge.textContent = ''; streakBadge.className = 'streak-badge'; return; }
      const label = side === 'heads' ? 'Heads' : 'Tails';
      streakBadge.textContent = `${n} ${label} in a row${n >= 5 ? ' 🔥' : ''}`;
      streakBadge.className = 'streak-badge' + (n >= 5 ? ' hot' : '');
    }

    // ── Confetti ───────────────────────────────────────────────────
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [], confettiFrame = null;

    function launchConfetti() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ['#F5C842','#ff6b6b','#48dbfb','#ff9f43','#a29bfe','#55efc4','#fdcb6e'];
      for (let i = 0; i < 120; i++) {
        confettiParticles.push({
          x: Math.random() * canvas.width, y: -10 - Math.random() * 40,
          w: 6 + Math.random() * 6, h: 10 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.15,
          vx: (Math.random() - 0.5) * 3, vy: 2.5 + Math.random() * 3, alpha: 1,
        });
      }
      if (!confettiFrame) animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiParticles = confettiParticles.filter(p => p.alpha > 0.05);
      confettiParticles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed;
        if (p.y > canvas.height * 0.75) p.alpha -= 0.03;
        ctx.save(); ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (confettiParticles.length > 0) {
        confettiFrame = requestAnimationFrame(animateConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiFrame = null;
      }
    }

    function resetStats() {
      heads = 0; tails = 0; streak = 0; lastResult = null;
      if (autoInterval) toggleAutoFlip();
      if (bo3Active) cancelBo3();
      document.getElementById('headsCount').textContent = '0';
      document.getElementById('tailsCount').textContent = '0';
      document.getElementById('totalCount').textContent = '0';
      histEl.innerHTML = '';
      resultEl.className = 'result hidden';
      streakBadge.textContent = '';
      streakBadge.className = 'streak-badge';
      coin.style.transform = '';
    }
  </script>
</body>
