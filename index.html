<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Flip</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold-light: #F5C842;
      --gold-mid: #D4A017;
      --gold-dark: #8B6914;
      --silver-light: #E8E8E8;
      --silver-mid: #B0B0B0;
      --silver-dark: #5C5C5C;
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --text: #F0EDE6;
      --text-muted: #888;
      --heads: #F5C842;
      --tails: #B0B0B0;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 3rem;
      font-family: 'Arial', sans-serif;
    }

    .coin-wrap {
      perspective: 600px;
      width: 160px;
      height: 160px;
      margin: 0 auto 3rem;
      cursor: pointer;
    }

    .coin {
      width: 160px;
      height: 160px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0s;
      border-radius: 50%;
    }

    .coin.flipping {
      animation: flip 1.2s cubic-bezier(.36,.07,.19,.97) forwards;
    }

    @keyframes flip {
      0%   { transform: rotateY(0deg) rotateX(10deg); }
      20%  { transform: rotateY(360deg) rotateX(25deg) translateY(-30px); }
      50%  { transform: rotateY(720deg) rotateX(20deg) translateY(-60px); }
      80%  { transform: rotateY(1080deg) rotateX(15deg) translateY(-20px); }
      100% { transform: rotateY(1440deg) rotateX(0deg) translateY(0px); }
    }

    .face {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Arial', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      user-select: none;
    }

    .face.heads {
      background: radial-gradient(circle at 38% 35%, #FFE57A, #D4A017 55%, #8B6914);
      color: #3a2800;
      box-shadow: inset 0 0 0 6px rgba(255,220,80,0.4), inset 0 0 0 8px rgba(180,130,0,0.3);
    }

    .face.tails {
      background: radial-gradient(circle at 38% 35%, #F0F0F0, #B0B0B0 55%, #5C5C5C);
      color: #333;
      box-shadow: inset 0 0 0 6px rgba(220,220,220,0.4), inset 0 0 0 8px rgba(140,140,140,0.3);
      transform: rotateY(180deg);
    }

    .face-symbol {
      font-size: 2.8rem;
      line-height: 1;
      margin-bottom: 6px;
    }

    .face-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      opacity: 0.7;
    }

    .flip-btn {
      background: transparent;
      border: 1.5px solid var(--gold-mid);
      color: var(--gold-light);
      font-family: 'Arial', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.75rem 2.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.1s;
      margin-bottom: 2.5rem;
    }

    .flip-btn:hover { background: rgba(213,160,23,0.12); }
    .flip-btn:active { transform: scale(0.97); }
    .flip-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .result {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      min-height: 2.2rem;
      transition: opacity 0.3s;
      text-align: center;
    }

    .result.heads { color: var(--gold-light); }
    .result.tails { color: var(--silver-light); }
    .result.hidden { opacity: 0; }

    .stats {
      display: flex;
      gap: 2rem;
      margin-top: 2.5rem;
      background: var(--surface);
      border: 0.5px solid #333;
      border-radius: var(--radius);
      padding: 1rem 2rem;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 400;
    }

    .stat-value.heads { color: var(--gold-light); }
    .stat-value.tails { color: var(--silver-light); }
    .stat-value.total { color: var(--text-muted); }

    .stat-label {
      font-family: 'Arial', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .divider {
      width: 0.5px;
      background: #333;
    }

    .history {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      max-width: 360px;
    }

    .hist-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .hist-dot.heads { background: var(--gold-mid); }
    .hist-dot.tails { background: var(--silver-mid); }

    .reset-btn {
      margin-top: 1.5rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Arial', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      transition: color 0.2s;
    }

    .reset-btn:hover { color: var(--text); }
  </style>
</head>
<body>
  <h1>Coin Flip</h1>
  <p class="subtitle">Chance in motion</p>

  <div class="coin-wrap" id="coinWrap" onclick="flipCoin()" title="Click to flip">
    <div class="coin" id="coin">
      <div class="face heads">
        <div class="face-symbol">☀</div>
        <div class="face-label">Heads</div>
      </div>
      <div class="face tails">
        <div class="face-symbol">✦</div>
        <div class="face-label">Tails</div>
      </div>
    </div>
  </div>

  <button class="flip-btn" id="flipBtn" onclick="flipCoin()">Flip the coin</button>

  <div class="result hidden" id="result">—</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value heads" id="headsCount">0</div>
      <div class="stat-label">Heads</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-value total" id="totalCount">0</div>
      <div class="stat-label">Flips</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-value tails" id="tailsCount">0</div>
      <div class="stat-label">Tails</div>
    </div>
  </div>

  <div class="history" id="history"></div>

  <button class="reset-btn" onclick="resetStats()">↺ Reset stats</button>

  <script>
    let heads = 0, tails = 0;
    const coin = document.getElementById('coin');
    const btn = document.getElementById('flipBtn');
    const resultEl = document.getElementById('result');
    const histEl = document.getElementById('history');

    function flipCoin() {
      if (btn.disabled) return;
      btn.disabled = true;
      resultEl.classList.add('hidden');

      coin.classList.remove('flipping');
      void coin.offsetWidth;
      coin.classList.add('flipping');

      const isHeads = Math.random() < 0.5;

      setTimeout(() => {
        if (isHeads) {
          heads++;
          coin.style.transform = 'rotateY(0deg)';
          resultEl.textContent = 'Heads';
          resultEl.className = 'result heads';
        } else {
          tails++;
          coin.style.transform = 'rotateY(180deg)';
          resultEl.textContent = 'Tails';
          resultEl.className = 'result tails';
        }
        resultEl.classList.remove('hidden');

        document.getElementById('headsCount').textContent = heads;
        document.getElementById('tailsCount').textContent = tails;
        document.getElementById('totalCount').textContent = heads + tails;

        const dot = document.createElement('div');
        dot.className = 'hist-dot ' + (isHeads ? 'heads' : 'tails');
        histEl.appendChild(dot);
        if (histEl.children.length > 60) histEl.removeChild(histEl.firstChild);

        coin.classList.remove('flipping');
        btn.disabled = false;
      }, 1200);
    }

    function resetStats() {
      heads = 0; tails = 0;
      document.getElementById('headsCount').textContent = '0';
      document.getElementById('tailsCount').textContent = '0';
      document.getElementById('totalCount').textContent = '0';
      histEl.innerHTML = '';
      resultEl.className = 'result hidden';
      coin.style.transform = '';
    }
  </script>
</body>
</html>
